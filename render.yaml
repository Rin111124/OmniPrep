# Free demo deployment: API only. Render does not offer a free background worker.
# The ingestion worker is intentionally not declared here to avoid creating a paid service.
services:
  - type: web
    name: omniprep-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Supabase
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: Frontend__Url
        sync: false
